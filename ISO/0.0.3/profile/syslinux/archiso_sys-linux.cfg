LABEL unexus
MENU LABEL Boot uNexus OS 0.0.3 (x86_64, BIOS)
MENU DEFAULT
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 console=tty0 console=ttyS0,115200n8

LABEL unexus-safe
MENU LABEL Boot uNexus OS 0.0.3 safe graphics
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% module_blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm nouveau.modeset=1 unexus.safe=1 loglevel=4 console=tty0 console=ttyS0,115200n8

